/* ---------- 選擇題的小處罰：扣分 + 罰停 1 秒 ---------- */

function isChoiceMode(){
  var M=MODES[G.lv.mode];
  if(!M) return false;
  return typeof M.choice==='function' ? !!M.choice() : !!M.choice;
}
function sPenalty(){ tone(300,.14,'square',.14); tone(200,.22,'square',.13,.13); }
function floatPen(txt){
  var r=scoreChip.getBoundingClientRect();
  var d=document.createElement('div');
  d.className='floatpen'; d.textContent=txt;
  d.style.left=(r.left+r.width/2-18)+'px';
  d.style.top=(r.top+4)+'px';
  document.body.appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },1000);
}
/* hard=true：猜得到的題型（扣分＋停 10 秒）
   hard=false：動手操作型（不扣分，只停 3 秒，讓學生慢下來但不怕嘗試） */
function applyPenalty(hard){
  var ms = hard ? FREEZE_MS : SOFT_FREEZE_MS;
  if(hard && !HUNDRED){
    G.gained=Math.max(0,G.gained-PENALTY);
    S.score=Math.max(0,S.score-PENALTY);
    paintScore(); save();
    floatPen('−'+PENALTY);
    scoreChip.classList.add('hit');
    setTimeout(function(){ scoreChip.classList.remove('hit'); },620);
  }
  sPenalty();

  /* 罰停：選項與確定鍵鎖住
     記住是哪一局：罰停期間學生可能已經離開關卡（G 變成 null）或開了新的一關 */
  var g=G;
  g.frozen=true;
  var stage=document.getElementById('stage');
  var btn=document.getElementById('check');
  if(stage) stage.classList.add('frozen');
  if(btn) btn.disabled=true;
  var fb=document.querySelector('.fb');
  var bar=document.createElement('div');
  bar.className='freezebar'; bar.id='freezebar';
  var tail = hard ? '秒…利用這段時間把上面的提示看一次' : '秒…慢慢來，再檢查一次';
  bar.innerHTML='⏳ 罰停 <b>'+Math.round(ms/1000)+'</b> '+tail;
  if(fb) fb.appendChild(bar);
  var t0=Date.now();
  var iv=setInterval(function(){
    var rest=Math.max(0,Math.ceil((ms-(Date.now()-t0))/1000));
    var b=document.getElementById('freezebar');
    if(b) b.innerHTML='⏳ 罰停 <b>'+rest+'</b> '+tail;
  },200);
  setTimeout(function(){
    clearInterval(iv);
    g.frozen=false;
    if(G!==g) return;
    var st=document.getElementById('stage'); if(st) st.classList.remove('frozen');
    var bt=document.getElementById('check'); if(bt) bt.disabled=false;
    var b=document.getElementById('freezebar');
    if(b) b.outerHTML='<div class="freezebar done">✅ 可以再試一次了</div>';
    sTap();
  },ms);
}

/* ===================== 判題 ===================== */
function check(){
  if(G&&G.frozen) return;
  var lv=G.lv, it=lv.items[G.qi], M=MODES[lv.mode];
  G.tries++;
  var res = M.judge(it,lv) || {};
  /* halt：題目還沒作答完，不算一次嘗試，也不罰
     tone:'ok' 用在多步驟的關卡——這一步做對了，繼續下一步 */
  if(res.halt){
    var tone = res.tone==='ok' ? 'ok' : 'no';
    showFb(tone, res.msg||'還沒做完喔。');
    G.tries--;
    if(tone==='ok'){ sPick(); }
    else { sWrong(); flash('no'); }
    return;
  }
  if(res.ok) onRight(it); else onWrong(it, res.code||null);
}
function onRight(it){
  var lv=G.lv;
  G.combo++; if(G.combo>G.bestCombo) G.bestCombo=G.combo;
  var base = G.tries===1?10:4;
  var bonus = (G.tries===1 && G.combo>=3) ? 3 : 0;
  if(HUNDRED){ base = G.tries===1 ? (it.pt||0) : (G.tries===2 ? (it.pt||0)/2 : 0); bonus = 0; }
  if(G.tries===1) G.firstTry++;
  G.gained+=base+bonus; S.score+=base+bonus; paintScore();
  buddyReact('happy'); flash('ok');
  if(G.combo>=3) sCombo(G.combo); else sRight();
  burstAt(document.getElementById('stage'),['#ffb020','#2fa46b','#fff','#3aa6e0'],40);

  var msg = G.tries===1?('✅ 答對了！＋'+base+' 分'):('✅ 這次對了！＋'+base+' 分');
  if(HUNDRED) msg = G.tries===1 ? ('✅ 答對了！＋'+fmtPt(base)+' 分（本題 '+fmtPt(it.pt)+' 分）')
                : base>0 ? ('✅ 訂正成功！＋'+fmtPt(base)+' 分（本題 '+fmtPt(it.pt)+' 分，訂正拿一半）')
                         : ('✅ 做對了！看過答案才做對，這題不加分（本題 '+fmtPt(it.pt)+' 分）');
  if(bonus) msg += '　🔥 連續答對 ×'+G.combo+' 追加 ＋'+bonus+' 分';
  var M=MODES[G.lv.mode];
  var extra = M.onRight ? M.onRight(it) : null;
  if(extra && extra.msg) msg += extra.msg;
  showFb('ok',msg);
  var chk=document.getElementById('check');
  if(chk) chk.disabled=true;
  /* after：模組要改畫面的副作用，等回饋和按鈕都處理完才跑 */
  if(extra && extra.after) extra.after();
  /* hold：模組自己接管接下來的流程（例如換鈔機要先動手驗證） */
  if(extra && extra.hold) return;
  nextButton();
}
/* 玩法模組接管流程時，可以自己叫出「下一題」 */
function nextButton(){
  var last=G.qi+1>=G.lv.items.length;
  var act=document.querySelector('.actions');
  if(!act) return;
  act.innerHTML='<button class="btn go" id="next">'+(last?'看結果 →':'下一題 →')+'</button>';
  var b=document.getElementById('next');
  b.onclick=function(){
    G.qi++; sTap();
    if(G.qi<G.lv.items.length) renderQ(); else { clearTimer(); finish(); }
  };
  b.focus();
}
function onWrong(it,code){
  G.combo=0; G.wrongTotal++;
  buddyReact('sad'); sWrong(); flash('no');
  var pen=isChoiceMode();
  var m='';
  if(HUNDRED) m += '<div class="penline'+(pen?'':' soft')+'">'+(pen?'⛔ <b>選錯了</b>':'⏳ <b>再試一次</b>')
             + '　·　'+(G.tries===1?'訂正後可以拿這題一半的分數':'這題已經沒有分數了，但還是要做對')
             + '　·　先停 <b>'+Math.round((pen?FREEZE_MS:SOFT_FREEZE_MS)/1000)+' 秒</b></div>';
  else if(pen) m += '<div class="penline">⛔ <b>選錯了</b>　扣 <b>'+PENALTY+' 分</b>　·　罰停 <b>'
             + Math.round(FREEZE_MS/1000)+' 秒</b></div>';
  else    m += '<div class="penline soft">⏳ <b>再試一次</b>　不扣分　·　先停 <b>'
             + Math.round(SOFT_FREEZE_MS/1000)+' 秒</b>，把下面的提示看一次</div>';
  if(code){ noteMis(code); m+='💡 '+MIS[code]+'<span class="code">'+code+'</span>'; }
  else m+='再想想看：'+G.lv.hint;
  var M=MODES[G.lv.mode];
  var ex = M.onWrong ? M.onWrong(it,code) : null;
  if(ex && ex.msg) m += ex.msg;
  if(!(ex && ex.hold) && G.tries>=2) m += '<div class="ans">'+answerText(it)+'</div>';
  showFb('no',m);
  if(ex && ex.after) ex.after();
  applyPenalty(pen);
}
function answerText(it){
  var M=MODES[G.lv.mode];
  return (M && M.answer) ? M.answer(it) : '';

/* ===================== 停止鍵：先推算點數，再決定要不要停 ===================== */
function estimatePoints(provPerf){
  /* 沒玩過的關卡一律算 0 分——只玩一關不可能拿到滿點 */
  var sum=0, got=0;
  LEVELS.forEach(function(lv){
    if(G && lv.id===G.lv.id){ if(provPerf!=null){ sum+=provPerf; got++; } return; }
    var r=S.records[lv.id]; if(r){ sum+=r.perf; got++; }
  });
  if(!got) return null;
  var avg=sum/LEVELS.length;
  return { avg:avg, n:got, C:curvePoints(avg) };
}

/* ===================== 單關結算 ===================== */
function finish(){
  clearTimer();
  var lv=G.lv, total=lv.items.length;
  var P=levelPerf(G.firstTry,total,G.sec,lv.target,G.timeUp);
  var stars=P.perf>=NEED_3?3:P.perf>=NEED_2?2:1;
  if(HUNDRED){ var ratio=lvMax(lv)?G.gained/lvMax(lv):0; stars=ratio>=0.9?3:ratio>=0.7?2:1; }
  if(stars>(S.stars[lv.id]||0)) S.stars[lv.id]=stars;
  var old=S.records[lv.id];
  var plays=(old&&old.plays?old.plays:0)+1;
  var kept = !!old && !betterRun(G.gained,G.sec,old);
  if(!kept){
    S.records[lv.id]={sec:G.sec,gained:G.gained,firstTry:G.firstTry,total:total,
                      acc:P.acc,spd:P.spd,perf:P.perf,timeUp:G.timeUp,
                      stopped:!!G.stopped,done:G.qi,plays:plays,sos:G.sos||0};
  }else{
    old.plays=plays;
  }
  save(); paintScore(); pushScore(function(){ refreshClass(paintRank); });
  if(!G.timeUp&&!G.stopped){ sClear(); confetti(); if(stars===3) setTimeout(function(){sStar();confetti();},450); }
  else if(G.stopped) sMerge();
  else sWrong();

  var codes=Object.keys(G.codes).map(function(c){return [c,G.codes[c]];}).sort(function(a,b){return b[1]-a[1];});
  var remember = codes.length
    ? '<div class="remember"><h4>📌 這一關要特別記住</h4><ul>'
      + codes.map(function(p){return '<li>'+MIS[p[0]]+'<span class="code">'+p[0]+' ×'+p[1]+'</span></li>';}).join('')
      + '</ul></div>'
    : (G.wrongTotal
        ? '<div class="allgood">👍 '+(UNIT.slipText||'沒有踩到常見的迷思陷阱，錯的是操作上的小失誤。')+'</div>'
        : '<div class="allgood">🎉 全部一次做對，'+(UNIT.praiseText||'這一關的觀念很穩！')+'</div>');
  var allDone=LEVELS.every(function(l){return S.records[l.id];});

  app.innerHTML =
    '<div class="rhead"><div class="emoji">'+pet().f+(G.timeUp?'⏰':(stars===3?'🏆':stars===2?'🎖️':'💪'))+'</div>'
    + '<h2>'+(G.timeUp?'時間到！':(G.stopped?lv.id+' '+lv.name+'　提早結算':lv.id+' '+lv.name+' 完成'))+'</h2>'
    + '<div style="font-size:26px;letter-spacing:3px;color:#ffb020">'+'★'.repeat(stars)+'☆'.repeat(3-stars)+'</div></div>'
    + (kept?'<div class="chase">📌 這次 '+fmtPt(G.gained)+' 分，沒有超過之前的 <b>'+fmtPt(old.gained)+' 分</b>，保留之前比較好的成績。</div>':'')
    + '<div class="rstats">'
    + '<div class="stat"><b>'+fmt(G.sec)+'</b><span>⏱ 用時</span></div>'
    + '<div class="stat"><b>'+G.firstTry+'/'+total+'</b><span>一次就做對</span></div>'
    + (G.stopped?'<div class="stat"><b>'+G.qi+'/'+total+'</b><span>⏹ 做到第幾題</span></div>':'')
    + (HUNDRED ? '<div class="stat pt"><b>'+fmtPt(G.gained)+' / '+fmtPt(lvMax(lv))+'</b><span>⭐ 本關得分</span></div>'
               + (G.sos ? '<div class="stat"><b>'+G.sos+'</b><span>🆘 求救次數</span></div>' : '') + '</div>'
               + '<div class="ptbox"><h4>⭐ 分數怎麼算的</h4>'
               + '<div class="ptrow"><span>'+(lv.items.every(function(x){ return x.pt===lv.items[0].pt; })
                   ? '每一題 '+fmtPt(lv.items[0].pt)+' 分，共 '+total+' 題'
                   : '每一題的配分不一樣（題目下方會寫「本題 幾分」）')+'</span><b>本關 '+fmtPt(lvMax(lv))+' 分</b></div>'
               + '<div class="ptrow"><span>一次做對 '+G.firstTry+'/'+total+' 題：拿滿分；訂正後做對：拿一半</span><b>'+fmtPt(G.gained)+' 分</b></div>'
               + '<div class="ptrow"><span>全部關卡加起來</span><b>滿分 100 分</b></div></div>'
    : '<div class="stat"><b>+'+G.gained+'</b><span>⭐ 本關得分</span></div>'
    + '<div class="stat"><b>×'+G.bestCombo+'</b><span>🔥 最長連擊</span></div>'
    + (G.sos ? '<div class="stat"><b>'+G.sos+'</b><span>🆘 求救次數</span></div>' : '')
    + '<div class="stat pt"><b>'+pctText(P.perf)+'</b><span>🎁 本關表現</span></div></div>'
    + '<div class="ptbox"><h4>🎁 本關表現怎麼算的（正確度 × 速度倍率）</h4>'
    + '<div class="ptrow"><span>正確度：一次做對 '+G.firstTry+'/'+total+'</span><b>'+pctText(P.acc)+'</b></div>'
    + '<div class="ptrow"><span>速度倍率：用時 '+fmt(G.sec)+'（'+fmt(P.fast)+' 以內才是滿倍率）'
      +(G.timeUp?'（時間到）':'')+'</span><b>× '+pctText(P.mult)+'</b></div>'
    + '<div class="ptrow"><span>本關表現（四關平均後才換算點數）</span><b>'+pctText(P.perf)+'</b></div></div>')
    + remember

    + (allDone?'<button class="btn go" id="report">🏅 看'+UNIT.certName+' →</button><button class="btn ghost" id="map">回'+UNIT.home+'</button>'
              :'<button class="btn main" id="map">回'+UNIT.home+' →</button>')
    + '</div>';
  document.getElementById('again').onclick=function(){ startLevel(G.li); };
  document.getElementById('map').onclick=renderMap;
  var rp=document.getElementById('report'); if(rp) rp.onclick=renderReport;
}

   共用工具
   ============================================================ */
function rngM(seed){ var s=(seed*9301+49297)%233280; return function(){ s=(s*9301+49297)%233280; return s/233280; }; }
function shufM(arr, seed){
  var a=arr.slice(), r=rngM(seed+17);
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function mmText(mm){ return mm+' 毫米'; }
function cmText(mm){ return Math.floor(mm/10)+' 公分 '+(mm%10)+' 毫米'; }

function stageFish(it){
  G.st={ picked:[], act:null, done:false, order:shufM(it.pool, G.qi+1) };
  var line='';
  if(it.line){
    line = '<div class="mline"><span class="mlab">A ＝ '+it.line.a+'</span>'
         + '<div class="mbar"><i class="mpa"></i><i class="mpb"></i></div>'
         + '<span class="mlab">B ＝ '+it.line.b+'</span></div>';
  }
  return '<div class="mask">🎣 '+esc(it.ask)+'</div>'+line+'<div id="zone"></div>';
}
function paintFish(){
  var it=G.lv.items[G.qi], st=G.st;
  document.getElementById('zone').innerHTML =
      '<div class="mpool">'+st.order.map(function(v){
        var on=st.picked.indexOf(v)>=0;
        var right = st.done && it.ans.indexOf(v)>=0;
        return '<button class="mfish'+(on?' on':'')+(right?' right':'')+'" data-v="'+esc(v)+'"'
             + (st.done?' disabled':'')+'>'+esc(v)+'</button>';
      }).join('')+'</div>'
    + '<div class="mnet">已經撈起 <b>'+st.picked.length+'</b> 個　'
    + '<button class="btn main" id="mgo"'+(st.done?' disabled':'')+'>🥅 送出漁網</button></div>';
  Array.prototype.forEach.call(document.querySelectorAll('#zone .mfish'),function(b){
    b.onclick=function(){
      if(G.frozen) return;
      var v=b.dataset.v, i=G.st.picked.indexOf(v);
      if(i>=0) G.st.picked.splice(i,1); else G.st.picked.push(v);
      sPick(); paintFish();
    };
  });
  var g=document.getElementById('mgo');
  if(g) g.onclick=function(){ if(G.frozen) return; G.st.act='go'; sDrop(); check(); };
}

/* ============================================================
   L2 補洞直式
   ============================================================ */
function digitsOf4(n){ return ('0000'+n).slice(-4).split('').map(Number); }
function holeKey(h){ return h.row+'-'+h.pos; }
function stagePatch(it){
  G.st={ fill:{}, sel:null, act:null, done:false };
  if(it.kind==='col'){ it.holes.forEach(function(h){ G.st.fill[holeKey(h)]=null; }); G.st.sel=holeKey(it.holes[0]); }
  if(it.kind==='eq'){ G.st.typed=''; }
  return '<div class="mask">🖋️ '+(it.text?esc(it.text):'補上被墨水蓋住的數字')+'</div><div id="zone"></div>';
}
function patchRow(it, row, label){
  var val = row==='a'?it.a : (row==='b'?it.b : it.sum);
  var ds = digitsOf4(val), st=G.st;
  var cells = ds.map(function(d,i){
    var pos = 3-i;                               /* pos 0 = 個位 */
    var key = row+'-'+pos;
    var isHole = st.fill.hasOwnProperty(key);
    if(!isHole) return '<td>'+d+'</td>';
    var v = st.fill[key];
    return '<td class="mhole'+(st.sel===key?' sel':'')+(v!==null?' got':'')+'" data-k="'+key+'">'
         + (v===null?'■':v)+'</td>';
  }).join('');
  return '<tr class="'+(row==='sum'?'msum':'')+'"><td class="msign">'+label+'</td>'+cells+'</tr>';
}
function paintPatch(){
  var it=G.lv.items[G.qi], st=G.st;
  if(it.kind==='est'){
    document.getElementById('zone').innerHTML =
      '<div class="mopts">'+it.opts.map(function(v){
        return '<button class="mopt big" data-e="'+v+'"'+(st.done?' disabled':'')+'>'+v+'</button>';
      }).join('')+'</div>'
      + '<div class="mhint">先把兩個數取成最接近的整千，再算一次。</div>';
    Array.prototype.forEach.call(document.querySelectorAll('#zone .mopt'),function(b){
      b.onclick=function(){ if(G.frozen) return; G.st.act={type:'est', v:+b.dataset.e}; sPick(); check(); };
    });
    return;
  }
  if(it.kind==='eq'){
    document.getElementById('zone').innerHTML =
        '<div class="meq">'+it.expr.map(function(t){
          return t==='□' ? '<span class="meqhole">'+(st.typed===''?'□':st.typed)+'</span>'
                         : '<span class="meqt">'+esc(t)+'</span>';
        }).join('')+'</div>'
      + '<div class="mpad">'+[1,2,3,4,5,6,7,8,9,0].map(function(d){
          return '<button class="mkey" data-d="'+d+'">'+d+'</button>';
        }).join('')+'<button class="mkey del" data-d="del">⌫</button></div>'
      + '<div class="mnet"><button class="btn main" id="mgo"'+(st.done?' disabled':'')+'>✅ 送出</button></div>';
  }else{
    document.getElementById('zone').innerHTML =
        '<div class="mcolwrap"><table class="mcol">'
      +   patchRow(it,'a','')
      +   patchRow(it,'b',it.op)
      +   '<tr class="mline2"><td colspan="5"></td></tr>'
      +   patchRow(it,'sum','')
      + '</table></div>'
      + '<div class="mpad">'+[1,2,3,4,5,6,7,8,9,0].map(function(d){
          return '<button class="mkey" data-d="'+d+'">'+d+'</button>';
        }).join('')+'</div>'
      + '<div class="mnet"><button class="btn main" id="mgo"'+(st.done?' disabled':'')+'>✅ 送出</button></div>';
  }
  Array.prototype.forEach.call(document.querySelectorAll('#zone .mhole'),function(td){
    td.onclick=function(){ if(G.frozen) return; G.st.sel=td.dataset.k; sTap(); paintPatch(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('#zone .mkey'),function(b){
    b.onclick=function(){
      if(G.frozen) return;
      var d=b.dataset.d, st2=G.st;
      if(it.kind==='eq'){
        if(d==='del') st2.typed=st2.typed.slice(0,-1);
        else if(st2.typed.length<it.digits) st2.typed+=d;
      }else{
        if(st2.sel!==null){
          st2.fill[st2.sel]=+d;
          var left=Object.keys(st2.fill).filter(function(k){ return st2.fill[k]===null; });
          st2.sel = left.length?left[0]:st2.sel;
        }
      }
      sTap(); paintPatch();
    };
  });
  var g=document.getElementById('mgo');
  if(g) g.onclick=function(){ if(G.frozen) return; G.st.act={type:'send'}; sDrop(); check(); };
}

/* ============================================================
   L3 天秤符號
   ============================================================ */
var SIGNS=[{s:">",lab:"＞"},{s:"=",lab:"＝"},{s:"<",lab:"＜"}];
function stageSign(it){
  G.st={ act:null, done:false };
  return '<div class="mask">⚖️ 中間要放哪一個符號？</div><div id="zone"></div>';
}
function paintSign(){
  var it=G.lv.items[G.qi], st=G.st;
  document.getElementById('zone').innerHTML =
      '<div class="mscale">'
    + '<div class="mpan">'+esc(it.l)+(st.done?'<small>＝ '+it.lv+'</small>':'')+'</div>'
    + '<div class="msignbox">'+(st.done?SIGNS.filter(function(x){return x.s===it.ans;})[0].lab:'？')+'</div>'
    + '<div class="mpan">'+esc(it.r)+(st.done?'<small>＝ '+it.rv+'</small>':'')+'</div>'
    + '</div>'
    + '<div class="mopts">'+SIGNS.map(function(x){
        return '<button class="mopt sign" data-s="'+x.s+'"'+(st.done?' disabled':'')+'>'+x.lab+'</button>';
      }).join('')+'</div>';
  Array.prototype.forEach.call(document.querySelectorAll('#zone .mopt'),function(b){
    b.onclick=function(){ if(G.frozen) return; G.st.act=b.dataset.s; sPick(); check(); };
  });
}

/* ============================================================
   L4 游標卡尺
   ============================================================ */
function calOpts(it){
  var len=it.right-it.left;
  var wrong1=it.right, wrong2=len+10;
  var mk=function(v){ return it.askCm ? cmText(v) : mmText(v); };
  var out=[mk(len), mk(wrong1), mk(wrong2)];
  return shufM(out, G.qi+3);
}
function stageCaliper(it){
  G.st={ lo:it.x0, hi:it.x0+10, step:0, act:null, done:false };
  return '<div class="mask">📏 這把尺從 <b>'+(it.x0/10)+' 公分</b> 才開始。夾住物件，量出它有多長。</div>'
       + '<div id="zone"></div>';
}
function paintCaliper(){
  var it=G.lv.items[G.qi], st=G.st, lo=100, hi=120;   /* 尺全長 120 毫米 */
  var total=120;
  var ticks='';
  for(var m=it.x0;m<=total;m++){
    var cls=(m%10===0)?'c10':((m%5===0)?'c5':'c1');
    ticks += '<i class="'+cls+'" style="left:'+(m/total*100)+'%"></i>';
  }
  var labs='';
  for(var c=Math.ceil(it.x0/10);c<=12;c++)
    labs += '<span class="mclab" style="left:'+(c*10/total*100)+'%">'+c+'</span>';
  var broken='<div class="mbroken" style="width:'+(it.x0/total*100)+'%">✂️ 斷掉</div>';
  var obj='<div class="mobj" style="left:'+(it.left/total*100)+'%;width:'+((it.right-it.left)/total*100)+'%"></div>';
  var cl='<div class="mcur lo" style="left:'+(st.lo/total*100)+'%"><b>◀</b></div>';
  var cr='<div class="mcur hi" style="left:'+(st.hi/total*100)+'%"><b>▶</b></div>';
  var h='<div class="mruler">'+ticks+labs+broken+obj+cl+cr+'</div>'
      + '<div class="mread">左游標 <b>'+st.lo+'</b> 毫米　·　右游標 <b>'+st.hi+'</b> 毫米</div>';
  if(st.step===0){
    h += '<div class="mmoves">'
      +  '<div class="mmv"><span>左游標</span>'
      +    '<button class="mkey" data-c="lo" data-d="-10">−10</button>'
      +    '<button class="mkey" data-c="lo" data-d="-1">−1</button>'
      +    '<button class="mkey" data-c="lo" data-d="1">＋1</button>'
      +    '<button class="mkey" data-c="lo" data-d="10">＋10</button></div>'
      +  '<div class="mmv"><span>右游標</span>'
      +    '<button class="mkey" data-c="hi" data-d="-10">−10</button>'
      +    '<button class="mkey" data-c="hi" data-d="-1">−1</button>'
      +    '<button class="mkey" data-c="hi" data-d="1">＋1</button>'
      +    '<button class="mkey" data-c="hi" data-d="10">＋10</button></div>'
      +  '</div>'
      +  '<div class="mnet"><button class="btn main" id="mgo">📐 量！</button></div>';
  }else{
    h += '<div class="mask2">右端 '+st.hi+' － 左端 '+st.lo+' ＝ ？　'
      +  (it.askCm?'（答案寫成「幾公分幾毫米」）':'（答案寫成「幾毫米」）')+'</div>'
      +  '<div class="mopts">'+st.opts.map(function(o){
           return '<button class="mopt" data-a="'+esc(o)+'"'+(st.done?' disabled':'')+'>'+esc(o)+'</button>';
         }).join('')+'</div>';
  }
  document.getElementById('zone').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('#zone .mkey[data-c]'),function(b){
    b.onclick=function(){
      if(G.frozen) return;
      var c=b.dataset.c, d=+b.dataset.d, s2=G.st;
      s2[c]=Math.max(it.x0, Math.min(120, s2[c]+d));
      if(s2.lo>s2.hi){ if(c==='lo') s2.lo=s2.hi; else s2.hi=s2.lo; }
      sTap(); paintCaliper();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('#zone .mopt'),function(b){
    b.onclick=function(){ if(G.frozen) return; G.st.act={type:'ans', v:b.dataset.a}; sPick(); check(); };
  });
  var g=document.getElementById('mgo');
  if(g) g.onclick=function(){ if(G.frozen) return; G.st.act={type:'measure'}; sDrop(); check(); };
}

/* ============================================================
   玩法登錄表
   ============================================================ */
MODES = {

  fish: {
    choice: true,
    noCheck: true,
    sub: function(){ return '把所有符合條件的數都撈起來，少撈或多撈都算錯'; },
    title: function(it){ return it.ask; },
    stage: stageFish,
    bind: paintFish,
    sos: function(it){
      return [ '先把條件讀一次，想清楚它在問<b>哪一種</b>：是讀法、位值、大小，還是數線的範圍？',
               '再<b>一個一個</b>檢查水池裡的數，不要只挑看起來像的。',
               '符合的可能<b>不只一個</b>——檢查到最後一個再送出。' ];
    },
    judge: function(it){
      var st=G.st; var a=st.act; st.act=null;
      if(st.done) return {halt:true, msg:'這一題已經完成了，按「下一題」。'};
      if(a!=='go') return {halt:true, msg:'點水池裡的數把它撈起來，撈好再送出漁網。'};
      if(!st.picked.length) return {halt:true, msg:'還沒撈任何東西喔。'};
      var missing=it.ans.filter(function(v){ return st.picked.indexOf(v)<0; });
      var extra=st.picked.filter(function(v){ return it.ans.indexOf(v)<0; });
      if(!missing.length && !extra.length) return {ok:true};
      return {ok:false, code:(extra.length?'FISH_EXTRA':'FISH_MISS')};
    },
    answer: function(it){ return '正解：'+it.ans.join('、')+'（共 '+it.ans.length+' 個）'; },
    onWrong: function(it){
      var st=G.st;
      var missing=it.ans.filter(function(v){ return st.picked.indexOf(v)<0; });
      var extra=st.picked.filter(function(v){ return it.ans.indexOf(v)<0; });
      var m='';
      if(extra.length) m+='<div class="ans">多撈了：'+extra.join('、')+'</div>';
      if(missing.length) m+='<div class="ans">還有 '+missing.length+' 個沒撈到。</div>';
      /* 再補一條「這一題在考什麼」的概念提示，並記進本關統計 */
      if(it.code && MIS[it.code]){ noteMis(it.code); m+='<div class="ans">💡 '+MIS[it.code]+'</div>'; }
      return { msg:m };
    },
    onRight: function(it){
      G.st.done=true;
      return { msg:'<div class="ans">🎣 全中！'+it.ans.join('、')+' 都符合條件。</div>', after: paintFish };
    }
  },

  patch: {
    choice: function(){ var it=G.lv.items[G.qi]; return it.kind==='est'; },   /* 估算是選擇題；補洞是動手型 */
    noCheck: true,
    sub: function(it){
      return it.kind==='est' ? '先取整千再估，選最接近的'
           : (it.kind==='eq' ? '這題是逆過來的：用鍵盤把原本的數打出來'
                             : '點黑色方塊，再用鍵盤把被蓋住的數字補上');
    },
    title: function(it){
      return it.kind==='est' ? it.text : (it.kind==='eq' ? '原本有多少？' : '補上被蓋住的數字');
    },
    stage: stagePatch,
    bind: paintPatch,
    sos: function(it){
      if(it.kind==='est') return [ '估算先把每個數取成<b>最接近的整千</b>。',
                                   '再用整千算一次，就知道答案大約多少。',
                                   '例如 2980 ＋ 4120：3000 ＋ 4000 ＝ 7000，選最接近 7000 的。' ];
      if(it.kind==='eq') return [ '把題目的關係想清楚：誰是<b>全部</b>、誰是<b>部分</b>？',
                                  '算式裡缺的是最前面的那個數，可以用<b>逆運算</b>回推。',
                                  '例如 □ － 300 ＝ 500，就是 500 ＋ 300 ＝ 800。換你算這一題。' ];
      return [ '從<b>個位</b>開始一位一位對，先找出哪一位可以確定。',
               it.op==='＋' ? '加法滿 10 要<b>進 1</b> 到左邊：被蓋住的那一位要把進位算進去。'
                            : '減法不夠減要<b>向左邊借 1</b>（借來的是 10），被借走的那一位要少 1。',
               '算出來以後可以把整個直式重算一次檢查。' ];
    },
    judge: function(it){
      var st=G.st, a=st.act; st.act=null;
      if(st.done) return {halt:true, msg:'這一題已經完成了，按「下一題」。'};
      if(!a) return {halt:true, msg:'先作答。'};
      if(it.kind==='est'){
        if(a.type!=='est') return {halt:true, msg:'選一個最接近的數。'};
        if(a.v===it.ans) return {ok:true};
        return {ok:false, code:it.code};
      }
      if(it.kind==='eq'){
        if(st.typed==='') return {halt:true, msg:'用鍵盤把答案打出來。'};
        if(+st.typed===it.hole) return {ok:true};
        return {ok:false, code:it.code};
      }
      var miss=Object.keys(st.fill).filter(function(k){ return st.fill[k]===null; });
      if(miss.length) return {halt:true, msg:'還有洞沒補完（'+miss.length+' 個）。'};
      var bad=false;
      it.holes.forEach(function(h){
        var val = h.row==='a'?it.a : (h.row==='b'?it.b : it.sum);
        var want = digitsOf4(val)[3-h.pos];
        if(st.fill[holeKey(h)]!==want) bad=true;
      });
      if(!bad) return {ok:true};
      return {ok:false, code:it.code};
    },
    answer: function(it){
      if(it.kind==='est') return '正解：'+it.ans;
      if(it.kind==='eq') return '正解：'+it.hole;
      return '正解：'+it.a+' '+it.op+' '+it.b+' ＝ '+it.sum;
    },
    onRight: function(it){
      G.st.done=true;
      var m = it.kind==='est' ? '<div class="ans">🎯 估得好！最接近 <b>'+it.ans+'</b></div>'
            : it.kind==='eq' ? '<div class="ans">🔎 推回來了：原本是 <b>'+it.hole+'</b></div>'
            : '<div class="ans">🖋️ 補對了！'+it.a+' '+it.op+' '+it.b+' ＝ <b>'+it.sum+'</b></div>';
      return { msg:m, after: paintPatch };
    }
  },

  sign: {
    choice: true,
    noCheck: true,
    sub: function(){ return '兩邊各算一次（或用估算），再插進正確的符號'; },
    title: function(it){ return it.l+' 　？　 '+it.r; },
    stage: stageSign,
    bind: paintSign,
    sos: function(it){
      return [ '先看能不能用<b>估算</b>判斷：把數取成整十整百比比看，差很多就不用硬算。',
               '要算的話：二、三位數乘一位數，<b>百、十、個分開乘再加起來</b>，進位不要漏。',
               '算完兩邊再比大小；＞ 的開口要對著比較大的那一邊。' ];
    },
    judge: function(it){
      var st=G.st, s=st.act; st.act=null;
      if(st.done) return {halt:true, msg:'這一題已經完成了，按「下一題」。'};
      if(!s) return {halt:true, msg:'選一個符號。'};
      if(s===it.ans) return {ok:true};
      /* 差距大到「估一下就知道」的題目，提示往估算帶；差一點點的才提醒要算仔細 */
      return {ok:false, code:(Math.abs(it.lv-it.rv)>=40?'MUL_SIZE':'MUL_CALC')};
    },
    answer: function(it){
      return '正解：'+it.l+' ＝ '+it.lv+'，'+it.r+' ＝ '+it.rv+'，所以是 '
           + SIGNS.filter(function(x){return x.s===it.ans;})[0].lab;
    },
    onRight: function(it){
      G.st.done=true;
      return { msg:'<div class="ans">⚖️ 平衡了！'+it.l+' ＝ '+it.lv+'，'+it.r+' ＝ '+it.rv+'</div>',
               after: paintSign };
    }
  },

  caliper: {
    choice: function(){ return G.st && G.st.step===1; },   /* 夾游標不扣分；選長度才是選擇題 */
    noCheck: true,
    sub: function(){ return '尺是斷的：夾住兩端，長度＝右端 － 左端'; },
    title: function(){ return '這個物件有多長？'; },
    stage: stageCaliper,
    bind: paintCaliper,
    sos: function(it){
      return [ '先把兩個游標<b>剛好夾在物件的兩端</b>（左游標對左邊、右游標對右邊）。',
               '這把尺不是從 0 開始，所以<b>不能直接讀右端的刻度</b>。',
               '長度 ＝ 右端刻度 － 左端刻度。例如右端 90、左端 25，長度就是 90 － 25 ＝ 65 毫米。' ];
    },
    judge: function(it){
      var st=G.st, a=st.act; st.act=null;
      if(st.done) return {halt:true, msg:'這一題已經完成了，按「下一題」。'};
      if(!a) return {halt:true, msg:'先用游標夾住物件的兩端。'};
      if(a.type==='measure'){
        if(st.lo!==it.left || st.hi!==it.right) return {ok:false, code:'CAL_EDGE'};
        st.step=1; st.opts=calOpts(it); paintCaliper();
        return {halt:true, tone:'ok', msg:'✔ 夾準了！右端 '+it.right+' 毫米、左端 '+it.left+' 毫米。那它有多長？'};
      }
      if(a.type==='ans'){
        if(st.step===0) return {halt:true, msg:'先夾住兩端再按「量！」。'};
        var len=it.right-it.left;
        var want = it.askCm ? cmText(len) : mmText(len);
        if(a.v===want) return {ok:true};
        if(a.v===(it.askCm?cmText(it.right):mmText(it.right))) return {ok:false, code:'CAL_SUB'};
        return {ok:false, code:'CM_MM'};
      }
      return {halt:true, msg:'先用游標夾住物件的兩端。'};
    },
    answer: function(it){
      var len=it.right-it.left;
      return '正解：'+it.right+' － '+it.left+' ＝ '+len+' 毫米 ＝ '+cmText(len);
    },
    onRight: function(it){
      G.st.done=true;
      var len=it.right-it.left;
      return { msg:'<div class="ans">📏 量出來了！'+it.right+' － '+it.left+' ＝ <b>'+len+'</b> 毫米 ＝ '
                 + cmText(len)+'</div>', after: paintCaliper };
    }
  }
};

</script>
